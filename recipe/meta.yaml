{% set name = "txmongo" %}
{% set version = "26.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9e530e73d770c3d1d44357463d7055b605869f8d3aab4f0c86b37be20d450488

build:
  noarch: python
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv '

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - pymongo >=3.12,<=4.18.2
    - twisted ~=24.11.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - txmongo
    - txmongo._gridfs
    - txmongo.utils

about:
  home: https://github.com/twisted/txmongo
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Asynchronous Python/Twisted driver for MongoDB
  doc_url: https://txmongo.readthedocs.io
  dev_url: https://github.com/twisted/txmongo

extra:
  recipe-maintainers:
    - holymonson
